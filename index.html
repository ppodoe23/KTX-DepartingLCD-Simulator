<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KTX LCD 안내화면</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <!-- 3D 인트로 -->
      <canvas id="gl"></canvas>
      <svg id="sketch" viewBox="0 0 1280 720"></svg>

      <!-- 노선도 지도 -->
      <section id="routeMap"></section>

      <!-- 정차역 안내 -->
      <div id="sky"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div></div>
      <div id="stopLayer" class="content-box"></div>
      <div id="tag">정차역 안내</div>

      <!-- 안전 안내 -->
      <section id="notice">
        <video id="noticeBg" muted loop playsinline></video>
        <div class="notice-wrap content-box"><div class="notice-box"><div class="notice-scroll"></div></div></div>
        <div class="ticker"><span></span></div>
      </section>
      <video id="afterVideo" playsinline></video>

      <div id="flash"></div>
      <div id="dim"></div>
      <div id="clock"><div class="d"></div><div class="t"></div></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
